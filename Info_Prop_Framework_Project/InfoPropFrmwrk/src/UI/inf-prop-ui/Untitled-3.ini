Add Level-specific computeds:
level0Data computed: summary observation card + quick metrics
level1Data computed: bottleneck table + node type stats + source/sink summaries
level2Data computed: upgrade recommendations + what-if sliders
level3Data computed: full node/edge tables + flow decomposition + export buttons
Add upgrade recommendation engine (frontend):
calculateUpgradeForNode(): takes node utilization, returns %capacity needed to reach target (e.g., 0.7)
calculateUpgradeForEdge(): same for edges
rankUpgrades(): sorts nodes/edges by impact (downside: high utilization, low capacity; upside: improves many downstream bottlenecks)
Add comparison overlay: comparisonScenarioName signal + comparisonLevel signal (show delta at current level)
Preserve: Multi-scenario loading, CSV/JSON export (extend with Level 3 detail)
