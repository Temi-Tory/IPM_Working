Decisions

Navigation model: Sequence (pick scenario → drill Levels 0-3 in sidebar), with optional comparison overlay
What-if logic: Frontend instant (slider → recalculate locally), backend authoritative (submit to validate upgrade feasibility)
Intervals: Removed entirely—Float64 only, no uncertainty display
Level 0 detail: Adaptive (3-metric card for large, rich summary for small networks)
Export: Full scenario package (JSON with all levels, node/edge tables, recommendations)
Theme: Keep existing Solarized + Material M2, extend with new sidebar/level colors
Comparison: Optional overlay panel (not primary view), shows current level delta only

 think purely graph-theoretically about what capacity analysis reveals:

The Universal Capacity Story (domain-agnostic)
Core Questions Any User Has:
"Is my network sufficient?" → Utilization metric
"Where's the chokepoint?" → Bottleneck identification
"What's wasted vs saturated?" → Spare capacity distribution
"How much gets through?" → Source→Sink throughput
"Where should I invest?" → Upgrade priorities
"How do conditions differ?" → Scenario comparison
These are pure graph/flow questions, not domain-specific.

Generic Layout: Math-Driven Information Hierarchy
Section 1: Network Efficiency (top-level KPIs)
Generic Insight: "Network delivers 94% of input to sinks with 67% capacity usage"
Works for: Any network, any domain

Section 2: Constraint Map (where's the problem?)
View A: Node-centric

Generic Insight: Nodes at >95% utilization are constraints
Filters:

Utilization threshold (show >X%)
Node role (sources, sinks, intermediaries)
Bottleneck status (yes/no)
View B: Edge-centric

Generic Insight: Edges at >95% are transmission constraints
Same filters applicable

Section 3: Source→Sink Analysis (flow accounting)
Per-Source Breakdown:

Generic Insight: Which sources deliver efficiently vs get constrained

Per-Sink Breakdown:

Generic Insight: Sink dependency on sources (if we add source decomposition)

Section 4: Critical Paths (flow-limiting routes)
Generic Insight: Multiple sinks share same constraint → high-leverage upgrade

Section 5: Upgrade Strategy (comparative analysis)
Generic Insight: ROI-ranked interventions (pure math: gap × downstream dependency)

Scenario Comparison: Pattern Detection (not domain interpretation)
Utilization Delta View
Generic Insight: Quantified trade-offs between scenarios

Bottleneck Migration Matrix
Generic Insight: Nodes constrained in multiple scenarios = structural weakness

Filters That Work for Any Network
Universal Filters:

✅ Utilization threshold: ">80%", ">95%", "100%", "All"
✅ Spare capacity threshold: "<1 unit", "<5%", "All"
✅ Bottleneck status: "Bottleneck only", "Non-bottleneck", "All"
✅ Node properties: Sources, Sinks, Intermediaries (computed from topology)
✅ Search: By node/edge ID
✅ Sort: Any numeric column
Cross-Scenario Filters:

✅ Persistence: "Bottlenecked in ≥N scenarios"
✅ Delta magnitude: "Utilization changed >X% between scenarios"
✅ Improvement/Degradation: "Got worse", "Got better", "Changed"
NO domain-specific filters (e.g., "BOD pathway", "nitrogen nodes") — those are external labels

What NOT to Assume
❌ Node semantic meaning (grid-graph has no "treatment", drone network has no "water")
❌ What "high" utilization means (95% might be normal in one domain, critical in another)
❌ Upgrade feasibility/cost (user's decision)
❌ Scenario likelihood (framework shows impacts, not probabilities)

✅ Only infer from graph structure:

Node degree (fork/join points)
Path convergence (multiple paths → critical dependency)
Spare capacity headroom (mathematical slack)
Comparative gaps (difference between classical vs realistic = processing constraint)
Refined View Design (truly generic)
Primary Tab: "Overview"
Headline metrics: Utilization, throughput efficiency, bottleneck count
Distribution histogram: Show utilization distribution across all nodes (visual pattern)
Healthy: Most nodes <70%, few >90%
Stressed: Many nodes >90%
Unbalanced: Bimodal (some starved, some saturated)
Top-N constraints table: 5-10 highest-utilized nodes/edges
Upgrade priorities: From comparative analysis
Story: "3-second health check + where to look deeper"

Secondary Tab: "Nodes" / "Edges"
Full sortable/filterable table
Heat-mapped utilization column (visual scanning)
Spare capacity column (absolute + % shown)
No domain interpretation - just numbers
Story: "Detailed data explorer for deep-dive analysis"

Tertiary Tab: "Flow Paths"
Critical paths per sink (from backend)
Path comparison: If multiple sinks share a path → that path is HIGH LEVERAGE
Bottleneck highlighting on paths
Story: "Dependency structure—which constraints affect many sinks?"

Quaternary Tab: "Comparative" (if comparative_analysis exists)
Realistic vs Classical gaps (shows processing constraints)
Upgrade impact estimates
Story: "If we removed processing limits, how much would throughput improve?"

Comparison Mode (≥2 scenarios loaded)
Delta-focused: Highlight changes, not absolute values
Pattern detection: "3 nodes became bottlenecks", "Utilization increased everywhere vs localized"
Bottleneck persistence matrix (which nodes constrained across scenarios)
Story: "How do operating conditions change system behavior?"