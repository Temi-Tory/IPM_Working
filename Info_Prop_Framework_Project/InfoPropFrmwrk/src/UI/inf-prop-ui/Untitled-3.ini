

Plan: Progressive-Revelation Capacity Analysis UI Rebuild
TL;DR
Replace the current 668-line template with a Level-based sidebar navigation (Level 0-3) and remove all interval arithmetic display logic. The service stays the same (Float64 from backend). Component will have separate computed properties for each level (health check → bottleneck explorer → what-if scenarios → engineer detailed). Frontend calculates instant upgrade recommendations; backend validates with detailed flow decomposition. Export full scenario at Level 3. Themes stay Solarized, Material M2.

Steps

