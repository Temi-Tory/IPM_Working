<div class="flow-shell">
  <mat-toolbar class="flow-toolbar">
    <div class="title-group">
      <h1>Flow Capacity Workbench</h1>
      <p>DAG throughput, bottleneck, and scenario diagnostics</p>
    </div>

    <div class="toolbar-actions">
      <mat-form-field appearance="outline" class="scenario-select">
        <mat-label>Scenario</mat-label>
        <mat-select [ngModel]="store.selectedScenario()" (ngModelChange)="store.setScenario($event)">
          @for (scenario of store.scenarioOptions(); track scenario.name) {
            <mat-option [value]="scenario.name">{{ scenario.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <button mat-raised-button color="primary" (click)="run()" [disabled]="store.runState() === 'running'">
        @if (store.runState() === 'running') {
          <mat-spinner diameter="16"></mat-spinner>
        } @else {
          <mat-icon>play_arrow</mat-icon>
        }
        Run
      </button>

      <button mat-stroked-button (click)="runAll()" [disabled]="store.runState() === 'running' || store.scenarioOptions().length < 2">
        <mat-icon>playlist_play</mat-icon>
        Run All
      </button>
    </div>
  </mat-toolbar>

  <mat-sidenav-container class="flow-container">
    <mat-sidenav mode="side" opened class="flow-nav">
      <nav>
        @for (item of navItems; track item.route) {
          <a
            class="nav-item"
            [class.active]="isActive(item.route)"
            [routerLink]="[item.route]">
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>

      @if (store.error()) {
        <div class="error-box">{{ store.error() }}</div>
      }
    </mat-sidenav>

    <mat-sidenav-content>
      <main class="flow-content">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
