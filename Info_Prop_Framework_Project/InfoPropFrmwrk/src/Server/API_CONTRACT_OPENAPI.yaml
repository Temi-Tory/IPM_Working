openapi: 3.0.3
info:
  title: InfoProp Server API Contract
  version: 2.0.0
  description: |
    Master contract for the modular InfoProp backend.

    Endpoint migration map:
    - /capacity-analysis -> /flow-analysis (legacy alias still available)
    - /reachability-analysis -> /probability-propagation (legacy alias still available)
    - /cpm-analysis -> /critical-path-analysis (legacy alias still available)
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: health
  - name: upload
  - name: sessions
  - name: files
  - name: docs
  - name: structure
  - name: flow
  - name: diamonds
  - name: probability
  - name: critical-path
  - name: legacy

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, server]
                properties:
                  status:
                    type: string
                    example: healthy
                  server:
                    type: string
                    example: InfoPropServer

  /upload:
    post:
      tags: [upload]
      summary: Upload network and related JSON files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/ApiError400'
        '500':
          $ref: '#/components/responses/ApiError500'

  /sessions:
    get:
      tags: [sessions]
      summary: List all upload sessions
      responses:
        '200':
          description: Session list returned
          content:
            application/json:
              schema:
                type: object
                required: [success, sessions]
                properties:
                  success:
                    type: boolean
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionSummary'
        '500':
          $ref: '#/components/responses/ApiError500'

  /sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [sessions]
      summary: Get full session metadata
      responses:
        '200':
          description: Session retrieved
          content:
            application/json:
              schema:
                type: object
                required: [success, session]
                properties:
                  success:
                    type: boolean
                  session:
                    $ref: '#/components/schemas/SessionMetadata'
        '404':
          $ref: '#/components/responses/ApiError404'
        '500':
          $ref: '#/components/responses/ApiError500'
    put:
      tags: [sessions]
      summary: Update selected fields in a session document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdateRequest'
      responses:
        '200':
          description: Session updated
          content:
            application/json:
              schema:
                type: object
                required: [success, session]
                properties:
                  success:
                    type: boolean
                  session:
                    $ref: '#/components/schemas/SessionMetadata'
        '404':
          $ref: '#/components/responses/ApiError404'
        '500':
          $ref: '#/components/responses/ApiError500'
    delete:
      tags: [sessions]
      summary: Delete a session and its uploaded files
      responses:
        '200':
          description: Session deleted
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '500':
          $ref: '#/components/responses/ApiError500'

  /files/{networkPath}/{relativeFilePath}:
    get:
      tags: [files]
      summary: Load a JSON file beneath a network path
      parameters:
        - name: networkPath
          in: path
          required: true
          schema:
            type: string
        - name: relativeFilePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Parsed JSON file content
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/ApiError400'
        '404':
          $ref: '#/components/responses/ApiError404'
        '500':
          $ref: '#/components/responses/ApiError500'

  /docs-list:
    get:
      tags: [docs]
      summary: List markdown files in server docs folder
      responses:
        '200':
          description: Documentation file list
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items:
                      type: string
        '500':
          $ref: '#/components/responses/ApiError500'

  /docs/{docPath}:
    get:
      tags: [docs]
      summary: Return markdown content for one docs file
      parameters:
        - name: docPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Markdown content
          content:
            text/markdown:
              schema:
                type: string
        '400':
          description: Invalid docs path
        '403':
          description: Path traversal blocked
        '404':
          description: File not found
        '500':
          description: Docs read failure

  /network-structure:
    post:
      tags: [structure]
      summary: Compute graph structure descriptors from .EDGES graph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkStructureRequest'
      responses:
        '200':
          description: Structure analysis completed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/ApiError400'
        '500':
          $ref: '#/components/responses/ApiError500'

  /diamond-analysis:
    post:
      tags: [diamonds]
      summary: Identify root and unique diamonds in a network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiamondAnalysisRequest'
      responses:
        '200':
          description: Diamond analysis completed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/ApiError400'
        '500':
          $ref: '#/components/responses/ApiError500'

  /diamond-subgraph-analysis:
    post:
      tags: [diamonds]
      summary: Run focused analyses on one selected unique diamond
      description: |
        Accepts a diamond hash from /diamond-analysis and runs selected analyses
        within the diamond subgraph.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiamondSubgraphRequest'
      responses:
        '200':
          description: Diamond subgraph analysis completed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/ApiError400'
        '404':
          $ref: '#/components/responses/ApiError404'
        '500':
          $ref: '#/components/responses/ApiError500'

  /probability-propagation:
    post:
      tags: [probability]
      summary: Run exact probability propagation with diamond cache payload
      description: |
        New canonical endpoint replacing /reachability-analysis.
        Response includes cache payload under:
        probability_result.exact_inference.cache
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbabilityPropagationRequest'
      responses:
        '200':
          description: Probability propagation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbabilityPropagationResponse'
        '400':
          $ref: '#/components/responses/ApiError400'
        '500':
          $ref: '#/components/responses/ApiError500'

  /reachability-analysis:
    post:
      tags: [legacy, probability]
      summary: Legacy alias for /probability-propagation
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbabilityPropagationRequest'
      responses:
        '200':
          description: Probability propagation completed via legacy alias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbabilityPropagationResponse'
        '400':
          $ref: '#/components/responses/ApiError400'
        '500':
          $ref: '#/components/responses/ApiError500'

  /flow-analysis:
    post:
      tags: [flow]
      summary: Run CapacityAnalysisKit full flow analysis pipeline
      description: New canonical endpoint replacing /capacity-analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowAnalysisRequest'
      responses:
        '200':
          description: Flow analysis completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowAnalysisResponse'
        '400':
          $ref: '#/components/responses/ApiError400'
        '500':
          $ref: '#/components/responses/ApiError500'

  /capacity-analysis:
    post:
      tags: [legacy, flow]
      summary: Legacy alias for /flow-analysis
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowAnalysisRequest'
      responses:
        '200':
          description: Flow analysis completed via legacy alias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowAnalysisResponse'
        '400':
          $ref: '#/components/responses/ApiError400'
        '500':
          $ref: '#/components/responses/ApiError500'

  /critical-path-analysis:
    post:
      tags: [critical-path]
      summary: Run critical path time and cost analyses
      description: New canonical endpoint replacing /cpm-analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriticalPathRequest'
      responses:
        '200':
          description: Critical path analysis completed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/ApiError400'
        '500':
          $ref: '#/components/responses/ApiError500'

  /cpm-analysis:
    post:
      tags: [legacy, critical-path]
      summary: Legacy alias for /critical-path-analysis
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriticalPathRequest'
      responses:
        '200':
          description: Critical path analysis completed via legacy alias
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/ApiError400'
        '500':
          $ref: '#/components/responses/ApiError500'

components:
  responses:
    ApiError400:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ApiError404:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ApiError500:
      description: Server-side failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string

  schemas:
    ApiError:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          type: string
          nullable: true

    UploadResponse:
      type: object
      required: [success, message, network_path, network_name, upload_id, files_count, uploaded_files, edges_files]
      properties:
        success:
          type: boolean
        message:
          type: string
        network_path:
          type: string
        network_name:
          type: string
        upload_id:
          type: string
        files_count:
          type: integer
        uploaded_files:
          type: array
          items:
            type: string
        edges_files:
          type: array
          items:
            type: string

    SessionSummary:
      type: object
      required: [session_id, upload_id, network_name, network_path, timestamp, has_analysis_results]
      properties:
        session_id:
          type: string
        upload_id:
          type: string
        network_name:
          type: string
        network_path:
          type: string
        timestamp:
          type: string
        has_analysis_results:
          type: boolean

    SessionMetadata:
      type: object
      additionalProperties: true

    SessionUpdateRequest:
      type: object
      additionalProperties: true
      properties:
        network_path:
          type: string
        network_name:
          type: string
        network_data:
          nullable: true
        analysis_results:
          nullable: true
        analysis_history:
          type: array
          items:
            type: object
            additionalProperties: true
        parsed_data:
          nullable: true
        file_manager_state:
          nullable: true
        fileManagerState:
          nullable: true

    NetworkStructureRequest:
      type: object
      required: [networkPath]
      properties:
        networkPath:
          type: string
        edgesFilePath:
          type: string

    DiamondAnalysisRequest:
      type: object
      required: [networkPath]
      properties:
        networkPath:
          type: string
        edgesFilePath:
          type: string
        nodepriorsPath:
          type: string

    DiamondSubgraphRequest:
      type: object
      required: [networkPath, diamondHash]
      properties:
        networkPath:
          type: string
        edgesFilePath:
          type: string
        nodepriorsPath:
          type: string
        linkprobsPath:
          type: string
        capacitiesPath:
          type: string
        cpmPath:
          type: string
        diamondHash:
          type: string
          description: UInt64 hash string returned by /diamond-analysis.
        analyses:
          type: array
          items:
            type: string
            enum: [reachability, flow, capacity, cpm]
        sourceOverrides:
          type: object
          additionalProperties: true

    ProbabilityPropagationRequest:
      type: object
      required: [networkPath, nodepriorsPath, linkprobsPath]
      properties:
        networkPath:
          type: string
        edgesFilePath:
          type: string
        nodepriorsPath:
          type: string
        linkprobsPath:
          type: string
        includeExactInference:
          type: boolean
          default: true
        includeDiamondAnalysis:
          type: boolean
          default: false

    ProbabilityPropagationResponse:
      type: object
      required: [success, message, endpoint, timestamp, probability_result]
      properties:
        success:
          type: boolean
        message:
          type: string
        endpoint:
          type: string
          enum: [probability-propagation, reachability-analysis]
        timestamp:
          type: string
        network_path:
          type: string
        edges_file_path:
          type: string
        nodepriors_path:
          type: string
        linkprobs_path:
          type: string
        source_nodes:
          type: array
          items:
            type: integer
        sink_nodes:
          type: array
          items:
            type: integer
        probability_result:
          type: object
          additionalProperties: true
          description: Includes exact_inference.cache payload with cache entries.

    FlowAnalysisRequest:
      type: object
      required: [networkPath, capacitiesPath]
      properties:
        networkPath:
          type: string
        edgesFilePath:
          type: string
        capacitiesPath:
          type: string
        analysisOptions:
          type: object
          additionalProperties: true

    FlowAnalysisResponse:
      type: object
      required: [success, message, endpoint, timestamp, input, computation_time, capacity_result]
      properties:
        success:
          type: boolean
        message:
          type: string
        endpoint:
          type: string
          enum: [flow-analysis]
        timestamp:
          type: string
        input:
          type: object
          additionalProperties: true
        computation_time:
          type: number
        capacity_result:
          type: object
          additionalProperties: true

    CriticalPathRequest:
      type: object
      required: [networkPath, cpmPath]
      properties:
        networkPath:
          type: string
        edgesFilePath:
          type: string
        cpmPath:
          type: string
