openapi: 3.0.3
info:
  title: InfoProp Server API Contract
  version: 2.0.0
  description: |
    Master contract for the modular InfoProp backend.

    Endpoint migration map:
    - /capacity-analysis -> /flow-analysis (legacy alias still available)
    - /reachability-analysis -> /probability-propagation (legacy alias still available)
    - /cpm-analysis -> /critical-path-analysis (legacy alias still available)

    Deliberately NOT part of this API (previously called by the retired front end, no
    server implementation, no capability in the underlying package):
    - /docs-list, /docs/{docPath}  (docs are served as static front-end assets)
    - /analyze                     (retired batch route)
    - /capacity-analysis/upgrade-scenario, /capacity-analysis/validate-upgrades
      (interval/p-box-aware upgrade scenarios do not exist in CapacityAnalysisKit.jl)
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: health
  - name: upload
  - name: sessions
  - name: files
  - name: structure
  - name: flow
  - name: diamonds
  - name: probability
  - name: critical-path
  - name: legacy

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, server]
                properties:
                  status:
                    type: string
                    example: healthy
                  server:
                    type: string
                    example: InfoPropServer

  /upload:
    post:
      tags: [upload]
      summary: Upload network and related JSON files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/ApiError400'
        '500':
          $ref: '#/components/responses/ApiError500'

  /sessions:
    get:
      tags: [sessions]
      summary: List all upload sessions
      responses:
        '200':
          description: Session list returned
          content:
            application/json:
              schema:
                type: object
                required: [success, sessions]
                properties:
                  success:
                    type: boolean
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionSummary'
        '500':
          $ref: '#/components/responses/ApiError500'

  /sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [sessions]
      summary: Get full session metadata
      responses:
        '200':
          description: Session retrieved
          content:
            application/json:
              schema:
                type: object
                required: [success, session]
                properties:
                  success:
                    type: boolean
                  session:
                    $ref: '#/components/schemas/SessionMetadata'
        '404':
          $ref: '#/components/responses/ApiError404'
        '500':
          $ref: '#/components/responses/ApiError500'
    put:
      tags: [sessions]
      summary: Update selected fields in a session document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdateRequest'
      responses:
        '200':
          description: Session updated
          content:
            application/json:
              schema:
                type: object
                required: [success, session]
                properties:
                  success:
                    type: boolean
                  session:
                    $ref: '#/components/schemas/SessionMetadata'
        '404':
          $ref: '#/components/responses/ApiError404'
        '500':
          $ref: '#/components/responses/ApiError500'
    delete:
      tags: [sessions]
      summary: Delete a session and its uploaded files
      responses:
        '200':
          description: Session deleted
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '500':
          $ref: '#/components/responses/ApiError500'

  /files/{networkPath}/{relativeFilePath}:
    get:
      tags: [files]
      summary: Load a JSON file beneath a network path
      parameters:
        - name: networkPath
          in: path
          required: true
          schema:
            type: string
        - name: relativeFilePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Parsed JSON file content
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/ApiError400'
        '404':
          $ref: '#/components/responses/ApiError404'
        '500':
          $ref: '#/components/responses/ApiError500'

  /network-structure:
    post:
      tags: [structure]
      summary: Compute graph structure descriptors from .EDGES graph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkStructureRequest'
      responses:
        '200':
          description: Structure analysis completed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/ApiError400'
        '500':
          $ref: '#/components/responses/ApiError500'

  /diamond-analysis:
    post:
      tags: [diamonds]
      summary: Identify root and unique diamonds in a network
      description: |
        Backed by DiamondDecompositionModule.new_identify (the current
        correct-by-construction, factorised producer).

        Shape note (array-per-join): diamond_analysis.raw_root_diamonds is a map
        string(joinNode) -> ARRAY of conditioning-group objects. A single join can carry
        more than one independent diamond (parents with disjoint un-conditioned ancestry),
        so each value is a JSON array; a plain non-factorised join is a 1-element array.
        Each group object is { join_node, diamond: { conditioning_nodes, relevant_nodes,
        edgelist, edge_count, node_count }, non_diamond_parents }.
        diamond_analysis.raw_unique_diamonds is keyed by string(UInt64 hash); each entry's
        sub_diamond_structures is likewise string(joinNode) -> ARRAY of group objects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiamondAnalysisRequest'
      responses:
        '200':
          description: Diamond analysis completed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/ApiError400'
        '500':
          $ref: '#/components/responses/ApiError500'

  /diamond-subgraph-analysis:
    post:
      tags: [diamonds]
      summary: Run focused analyses on one selected unique diamond
      description: |
        Accepts a diamond hash from /diamond-analysis and runs selected analyses
        within the diamond subgraph.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiamondSubgraphRequest'
      responses:
        '200':
          description: Diamond subgraph analysis completed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/ApiError400'
        '404':
          $ref: '#/components/responses/ApiError404'
        '500':
          $ref: '#/components/responses/ApiError500'

  /probability-propagation:
    post:
      tags: [probability]
      summary: Run exact probability propagation with diamond cache payload
      description: |
        New canonical endpoint replacing /reachability-analysis.
        Response includes cache payload under:
        probability_result.exact_inference.cache

        Diamonds are identified with DiamondDecompositionModule.new_identify; when
        includeDiamondAnalysis is true the raw_root_diamonds / raw_unique_diamonds maps use
        the array-per-join shape documented on /diamond-analysis.
        Belief values keep their form: a number for Float64, { type: interval, lower, upper }
        for Interval, { type: pbox, ... } for probability-box.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbabilityPropagationRequest'
      responses:
        '200':
          description: Probability propagation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbabilityPropagationResponse'
        '400':
          $ref: '#/components/responses/ApiError400'
        '500':
          $ref: '#/components/responses/ApiError500'

  /reachability-analysis:
    post:
      tags: [legacy, probability]
      summary: Legacy alias for /probability-propagation
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbabilityPropagationRequest'
      responses:
        '200':
          description: Probability propagation completed via legacy alias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbabilityPropagationResponse'
        '400':
          $ref: '#/components/responses/ApiError400'
        '500':
          $ref: '#/components/responses/ApiError500'

  /flow-analysis:
    post:
      tags: [flow]
      summary: Run CapacityAnalysisKit full flow analysis pipeline
      description: New canonical endpoint replacing /capacity-analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowAnalysisRequest'
      responses:
        '200':
          description: Flow analysis completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowAnalysisResponse'
        '400':
          $ref: '#/components/responses/ApiError400'
        '500':
          $ref: '#/components/responses/ApiError500'

  /capacity-analysis:
    post:
      tags: [legacy, flow]
      summary: Legacy alias for /flow-analysis
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowAnalysisRequest'
      responses:
        '200':
          description: Flow analysis completed via legacy alias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowAnalysisResponse'
        '400':
          $ref: '#/components/responses/ApiError400'
        '500':
          $ref: '#/components/responses/ApiError500'

  /critical-path-analysis:
    post:
      tags: [critical-path]
      summary: Run schedule (time) and cost analyses via CriticalPathV2 (mode-based)
      description: |
        New canonical endpoint replacing /cpm-analysis. Backed by CriticalPathV2Module.
        Mode-based: LongestPath (max/+, classical CPM, the default), ShortestPath (min/+),
        MaxScaling (max/x), Accumulation (sum/+). Value types: Float64 and Interval only
        (no probability-box for schedule). The time and cost passes each take their mode
        from the CPM input file's declared combination_function / propagation_function,
        overridable by request `mode` (time) and `costMode` (cost).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriticalPathRequest'
      responses:
        '200':
          description: Critical path analysis completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriticalPathResponse'
        '400':
          $ref: '#/components/responses/ApiError400'
        '500':
          $ref: '#/components/responses/ApiError500'

  /cpm-analysis:
    post:
      tags: [legacy, critical-path]
      summary: Legacy alias for /critical-path-analysis
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriticalPathRequest'
      responses:
        '200':
          description: Critical path analysis completed via legacy alias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriticalPathResponse'
        '400':
          $ref: '#/components/responses/ApiError400'
        '500':
          $ref: '#/components/responses/ApiError500'

components:
  responses:
    ApiError400:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ApiError404:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ApiError500:
      description: Server-side failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string

  schemas:
    ApiError:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          type: string
          nullable: true

    UploadResponse:
      type: object
      required: [success, message, network_path, network_name, upload_id, files_count, uploaded_files, edges_files]
      properties:
        success:
          type: boolean
        message:
          type: string
        network_path:
          type: string
        network_name:
          type: string
        upload_id:
          type: string
        files_count:
          type: integer
        uploaded_files:
          type: array
          items:
            type: string
        edges_files:
          type: array
          items:
            type: string

    SessionSummary:
      type: object
      required: [session_id, upload_id, network_name, network_path, timestamp, has_analysis_results]
      properties:
        session_id:
          type: string
        upload_id:
          type: string
        network_name:
          type: string
        network_path:
          type: string
        timestamp:
          type: string
        has_analysis_results:
          type: boolean

    SessionMetadata:
      type: object
      additionalProperties: true

    SessionUpdateRequest:
      type: object
      additionalProperties: true
      properties:
        network_path:
          type: string
        network_name:
          type: string
        network_data:
          nullable: true
        analysis_results:
          nullable: true
        analysis_history:
          type: array
          items:
            type: object
            additionalProperties: true
        parsed_data:
          nullable: true
        file_manager_state:
          nullable: true
        fileManagerState:
          nullable: true

    NetworkStructureRequest:
      type: object
      required: [networkPath]
      properties:
        networkPath:
          type: string
        edgesFilePath:
          type: string

    DiamondAnalysisRequest:
      type: object
      required: [networkPath]
      properties:
        networkPath:
          type: string
        edgesFilePath:
          type: string
        nodepriorsPath:
          type: string

    DiamondSubgraphRequest:
      type: object
      required: [networkPath, diamondHash]
      properties:
        networkPath:
          type: string
        edgesFilePath:
          type: string
        nodepriorsPath:
          type: string
        linkprobsPath:
          type: string
        capacitiesPath:
          type: string
        cpmPath:
          type: string
        diamondHash:
          type: string
          description: UInt64 hash string returned by /diamond-analysis.
        analyses:
          type: array
          items:
            type: string
            enum: [reachability, flow, capacity, cpm]
        sourceOverrides:
          type: object
          additionalProperties: true

    ProbabilityPropagationRequest:
      type: object
      required: [networkPath, nodepriorsPath, linkprobsPath]
      properties:
        networkPath:
          type: string
        edgesFilePath:
          type: string
        nodepriorsPath:
          type: string
        linkprobsPath:
          type: string
        includeExactInference:
          type: boolean
          default: true
        includeDiamondAnalysis:
          type: boolean
          default: false

    ProbabilityPropagationResponse:
      type: object
      required: [success, message, endpoint, timestamp, probability_result]
      properties:
        success:
          type: boolean
        message:
          type: string
        endpoint:
          type: string
          enum: [probability-propagation, reachability-analysis]
        timestamp:
          type: string
        network_path:
          type: string
        edges_file_path:
          type: string
        nodepriors_path:
          type: string
        linkprobs_path:
          type: string
        source_nodes:
          type: array
          items:
            type: integer
        sink_nodes:
          type: array
          items:
            type: integer
        probability_result:
          type: object
          additionalProperties: true
          description: Includes exact_inference.cache payload with cache entries.

    FlowAnalysisRequest:
      type: object
      required: [networkPath, capacitiesPath]
      properties:
        networkPath:
          type: string
        edgesFilePath:
          type: string
        capacitiesPath:
          type: string
        analysisOptions:
          type: object
          additionalProperties: true

    FlowAnalysisResponse:
      type: object
      required: [success, message, endpoint, timestamp, input, computation_time, capacity_result]
      properties:
        success:
          type: boolean
        message:
          type: string
        endpoint:
          type: string
          enum: [flow-analysis]
        timestamp:
          type: string
        input:
          type: object
          additionalProperties: true
        computation_time:
          type: number
        capacity_result:
          type: object
          additionalProperties: true

    CriticalPathRequest:
      type: object
      required: [networkPath, cpmPath]
      properties:
        networkPath:
          type: string
        edgesFilePath:
          type: string
        cpmPath:
          type: string
        mode:
          type: string
          description: |
            Optional override for the TIME pass mode. One of longest_path, shortest_path,
            max_scaling, accumulation. Defaults to the CPM file's declared operators
            (currently always longest_path).
          enum: [longest_path, shortest_path, max_scaling, accumulation]
        costMode:
          type: string
          description: Optional override for the COST pass mode. Same values as `mode`; defaults to `mode`.
          enum: [longest_path, shortest_path, max_scaling, accumulation]

    CriticalPathResponse:
      type: object
      required: [success, message, endpoint, timestamp, critical_path_result]
      properties:
        success: { type: boolean }
        message: { type: string }
        endpoint:
          type: string
          enum: [critical-path-analysis, cpm-analysis]
        timestamp: { type: string }
        edges_file_path: { type: string }
        cpm_path: { type: string }
        critical_path_result:
          type: object
          required: [module_version, value_type, time_mode, time_result]
          properties:
            module_version:
              type: string
              enum: [CriticalPathV2]
            value_type:
              type: string
              enum: [Float64, Interval]
            time_mode: { type: string }
            cost_mode:
              type: string
              nullable: true
              description: null when the CPM file has no cost_analysis section.
            computation_time: { type: number }
            time_result:
              oneOf:
                - $ref: '#/components/schemas/CpmPathResult'
                - $ref: '#/components/schemas/CpmIntervalPathResult'
                - $ref: '#/components/schemas/CpmAccumulationResult'
            cost_result:
              nullable: true
              description: null when the CPM file has no cost_analysis section.
              oneOf:
                - $ref: '#/components/schemas/CpmPathResult'
                - $ref: '#/components/schemas/CpmIntervalPathResult'
                - $ref: '#/components/schemas/CpmAccumulationResult'
            input_files:
              type: object
              additionalProperties: true

    CpmPathResult:
      type: object
      description: |
        Float64 path-mode result (LongestPath / ShortestPath / MaxScaling). Node-keyed maps
        are string(nodeId) -> number. Schedule fields are present only for additive modes
        (schedule_available = true); MaxScaling omits them.
      required: [kind, mode, method, margin_name, value_type, project_value, forward, reverse_completion, through, margin, critical, schedule_available]
      properties:
        kind: { type: string, enum: [path] }
        mode: { type: string, enum: [longest_path, shortest_path, max_scaling] }
        method: { type: string, enum: [exact_scalar] }
        margin_name:
          type: string
          enum: [slack, margin, ratio_slack]
          description: slack (LongestPath), margin (ShortestPath), ratio_slack (MaxScaling)
        value_type: { type: string, enum: [Float64] }
        project_value: { type: number }
        forward:
          type: object
          additionalProperties: { type: number }
          description: F — best value of a path reaching the node, inclusive of the node (early finish for LongestPath).
        reverse_completion:
          type: object
          additionalProperties: { type: number }
          description: R — best value of a completion from the node to a sink, exclusive of the node.
        through:
          type: object
          additionalProperties: { type: number }
          description: best value of a complete path constrained to pass through the node.
        margin:
          type: object
          additionalProperties: { type: number }
          description: mode-named non-negative margin; node is critical iff margin ~ 0.
        critical:
          type: array
          items: { type: integer }
          description: nodes with margin ~ 0 (the critical path / optimal chain), topological order.
        schedule_available: { type: boolean }
        early_start:
          type: object
          additionalProperties: { type: number }
        late_finish:
          type: object
          additionalProperties: { type: number }
        late_start:
          type: object
          additionalProperties: { type: number }
        near_critical_nodes:
          type: array
          items: { type: integer }
          description: additive Float64 only — nodes with 0 < slack < 10% of project_value.

    CpmIntervalPathResult:
      type: object
      description: |
        Interval path-mode result. Forward quantities (forward, through, project_value) are
        EXACT corner-pair bounds. Margins/criticality are exact where tractable
        (method exact_domination_split or exact_corners_exhaustive) else a sound
        conservative enclosure (method conservative_enclosure — see method_note).
        The classical schedule quantities are NOT computed for the interval scheme
        (schedule_available = false).
      required: [kind, mode, method, margin_name, value_type, project_value, forward, through, margin, necessarily_critical, possibly_critical, corner_count, schedule_available]
      properties:
        kind: { type: string, enum: [path] }
        mode: { type: string, enum: [longest_path, shortest_path, max_scaling] }
        method:
          type: string
          enum: [exact_domination_split, exact_corners_exhaustive, conservative_enclosure]
        method_note: { type: string }
        margin_name: { type: string, enum: [slack, margin, ratio_slack] }
        value_type: { type: string, enum: [Interval] }
        project_value: { $ref: '#/components/schemas/IntervalValue' }
        forward:
          type: object
          additionalProperties: { $ref: '#/components/schemas/IntervalValue' }
        through:
          type: object
          additionalProperties: { $ref: '#/components/schemas/IntervalValue' }
        margin:
          type: object
          additionalProperties: { $ref: '#/components/schemas/IntervalValue' }
        necessarily_critical:
          type: array
          items: { type: integer }
          description: critical in EVERY corner (certain).
        possibly_critical:
          type: array
          items: { type: integer }
          description: critical in AT LEAST ONE corner (superset; may be loose under conservative_enclosure).
        corner_count: { type: integer }
        schedule_available: { type: boolean, enum: [false] }

    CpmAccumulationResult:
      type: object
      description: |
        Sum/+ accumulation result. Backward object is the adjoint pass: multiplicity =
        number of directed paths from the node to the target; sensitivity = d(total)/d(node);
        contribution = node value x multiplicity. allowance present only if a budget was given.
      required: [kind, mode, method, value_type, forward, target, total, multiplicity, sensitivity, contribution, ranking]
      properties:
        kind: { type: string, enum: [accumulation] }
        mode: { type: string, enum: [accumulation] }
        method: { type: string, enum: [exact_scalar] }
        margin_name: { type: string, enum: [allowance] }
        value_type: { type: string, enum: [Float64] }
        forward:
          type: object
          additionalProperties: { type: number }
        target: { type: integer }
        total: { type: number }
        multiplicity:
          type: object
          additionalProperties: { type: integer }
        sensitivity:
          type: object
          additionalProperties: { type: number }
        contribution:
          type: object
          additionalProperties: { type: number }
        allowance:
          type: object
          additionalProperties: { type: number }
        ranking:
          type: array
          items: { type: integer }

    IntervalValue:
      type: object
      required: [type, lower, upper]
      properties:
        type: { type: string, enum: [interval] }
        lower: { type: number }
        upper: { type: number }
