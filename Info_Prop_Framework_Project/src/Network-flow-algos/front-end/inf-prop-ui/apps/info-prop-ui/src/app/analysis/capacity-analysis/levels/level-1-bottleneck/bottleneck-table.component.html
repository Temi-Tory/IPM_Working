<div class="bottleneck-table-container">
  <!-- Search Bar -->
  <mat-form-field class="search-field">
    <mat-label>Search bottlenecks</mat-label>
    <input matInput [(ngModel)]="searchTerm" placeholder="Node ID, edge, or type..." />
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>

  <!-- Table -->
  <div class="table-wrapper">
    <table mat-table [dataSource]="tableData" matSort (matSortChange)="onSort($event)" class="bottleneck-table">
      <!-- Display Name Column -->
      <ng-container matColumnDef="displayName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Component</th>
        <td mat-cell *matCellDef="let row">
          <span class="component-badge" [class]="'type-' + row.type">{{ row.displayName }}</span>
        </td>
      </ng-container>

      <!-- Capacity Column -->
      <ng-container matColumnDef="capacity">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Capacity</th>
        <td mat-cell *matCellDef="let row">{{ row.capacity.toFixed(2) }}</td>
      </ng-container>

      <!-- Flow Column -->
      <ng-container matColumnDef="flow">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Flow</th>
        <td mat-cell *matCellDef="let row">{{ row.flow.toFixed(2) }}</td>
      </ng-container>

      <!-- Utilization Column with Heatmap -->
      <ng-container matColumnDef="utilization">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Utilization</th>
        <td mat-cell *matCellDef="let row">
          <div class="utilization-cell">
            <div class="utilization-bar" [style.width.%]="row.utilization * 100" 
                 [style.background-color]="getUtilizationColor(row.utilization)"></div>
            <span class="utilization-text">{{ (row.utilization * 100).toFixed(1) }}%</span>
          </div>
        </td>
      </ng-container>

      <!-- Spare Capacity Column -->
      <ng-container matColumnDef="spare">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Spare</th>
        <td mat-cell *matCellDef="let row">{{ row.spare.toFixed(2) }}</td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let row" [matTooltip]="getStatusDisplay(row).text">
          <mat-icon class="status-icon" [class]="'severity-' + (row.utilization >= 0.95 ? 'critical' : row.utilization >= 0.85 ? 'warning' : 'good')">
            {{ getStatusDisplay(row).icon }}
          </mat-icon>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="data-row"></tr>
    </table>
  </div>

  <!-- Paginator -->
  <mat-paginator
    [length]="tableData.length"
    [pageSize]="pageSize"
    [pageSizeOptions]="[10, 25, 50, 100]"
    (page)="onPageChange($event)"
    aria-label="Select page"
  ></mat-paginator>
</div>
