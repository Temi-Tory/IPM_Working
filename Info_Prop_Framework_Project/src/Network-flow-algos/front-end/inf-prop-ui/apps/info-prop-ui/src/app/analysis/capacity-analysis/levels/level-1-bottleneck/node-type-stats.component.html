<div class="node-type-stats-container">
  <h3 class="section-title">Network Topology Summary</h3>

  <div class="stats-scroll">
    @for (stat of stats; track stat.type) {
      <div class="stat-card">
        <mat-icon class="node-icon" [style.color]="getTypeColor(stat.type)">
          {{ getTypeIcon(stat.icon) }}
        </mat-icon>

        <div class="stat-content">
          <div class="node-type">{{ stat.type }}</div>
          <div class="stat-values">
            <span class="count" matTooltip="Number of nodes of this type">{{ stat.count }}</span>
            <span class="separator">•</span>
            <span class="utilization" matTooltip="Average utilization">{{ formatUtilization(stat.avgUtilization) }}</span>
          </div>
        </div>

        <div class="utilization-indicator" [style.background-color]="getTypeColor(stat.type)" 
             [style.opacity]="stat.avgUtilization"></div>
      </div>
    }
  </div>

  @if (stats.length === 0) {
    <div class="empty-state">
      <mat-icon>info</mat-icon>
      <p>No node type statistics available</p>
    </div>
  }
</div>
