<div class="overlay-backdrop" (click)="close()" *ngIf="isOpen()"></div>

<div class="overlay-panel" *ngIf="isOpen()">
  <div class="overlay-header">
    <h3>Comparison: {{ baseScenario }} vs {{ compareScenario }}</h3>
    <p class="level-info">{{ getLevelLabel() }} (Level {{ level }})</p>
    <button class="close-btn" (click)="close()">×</button>
  </div>

  <div class="overlay-content">
    <table class="comparison-table">
      <thead>
        <tr>
          <th>Metric</th>
          <th>{{ baseScenario }}</th>
          <th>{{ compareScenario }}</th>
          <th>Delta</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let key of getKeys()" [class]="getDeltaClass(key)">
          <td class="metric-name">{{ key }}</td>
          <td class="base-value">{{ formatValue(getBaseValue(key)) }}</td>
          <td class="compare-value">{{ formatValue(getCompareValue(key)) }}</td>
          <td class="delta-value">{{ getDelta(key) | number: '+1.2-2' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
