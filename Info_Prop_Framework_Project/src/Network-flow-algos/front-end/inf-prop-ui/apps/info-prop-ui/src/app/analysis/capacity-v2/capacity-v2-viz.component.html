<mat-card class="viz-card">
  <mat-card-header>
    <mat-card-title>Visualization</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    @if (store.activeDeterministicDetail()) {
      <div class="viz-toolbar">
        <mat-form-field appearance="outline" class="mode-select">
          <mat-label>Highlight mode</mat-label>
          <mat-select [(value)]="highlightModeValue" (selectionChange)="onHighlightModeChange($event)">
            @for (mode of highlightModes; track mode.value) {
              <mat-option [value]="mode.value">{{ mode.label }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <div class="controls">
          <button mat-stroked-button (click)="zoomIn()">Zoom +</button>
          <button mat-stroked-button (click)="zoomOut()">Zoom -</button>
          <button mat-stroked-button (click)="pan(-20, 0)">←</button>
          <button mat-stroked-button (click)="pan(20, 0)">→</button>
          <button mat-stroked-button (click)="pan(0, -20)">↑</button>
          <button mat-stroked-button (click)="pan(0, 20)">↓</button>
          <button mat-flat-button color="primary" (click)="resetView()">Reset</button>
        </div>
      </div>

      <div class="svg-wrap">
        <svg [attr.viewBox]="'0 0 ' + width + ' ' + height" preserveAspectRatio="xMidYMid meet">
          <g [attr.transform]="transform()">
            @for (edge of edges(); track trackEdge($index, edge)) {
              <line
                [attr.x1]="edge.x1"
                [attr.y1]="edge.y1"
                [attr.x2]="edge.x2"
                [attr.y2]="edge.y2"
                [attr.stroke-width]="edge.thickness"
                [attr.class]="connectedEdgeClass(edge)"
              >
                <title>Edge {{ edge.from }}→{{ edge.to }} | flow {{ edge.utilization | percent: '1.1-2' }}</title>
              </line>
            }

            @for (node of nodes(); track trackNode($index, node)) {
              <g>
                <circle
                  [attr.cx]="node.x"
                  [attr.cy]="node.y"
                  [attr.r]="node.radius"
                  [attr.class]="nodeClass(node)"
                  (click)="selectNode(node.id)"
                >
                  <title>Node {{ node.id }} | utilization {{ node.utilization | percent: '1.1-2' }}</title>
                </circle>
                <text [attr.x]="node.x" [attr.y]="node.y + 4" text-anchor="middle" class="node-label">
                  {{ node.id }}
                </text>
              </g>
            }
          </g>
        </svg>
      </div>
    } @else {
      <p class="empty">Run analysis to render flow visualization.</p>
    }
  </mat-card-content>
</mat-card>
